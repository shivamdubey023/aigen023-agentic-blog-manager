name: Validate Vercel web app

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python and frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q api app.py core property_a_blog tests

      - name: Validate Vercel configuration
        run: python -c "import json; json.load(open('vercel.json', encoding='utf-8'))"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check frontend JavaScript syntax
        run: |
          node --check static/js/app.js
          node --check static/ebook/app.js
          node --check static/ebook/service-worker.js
